<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>功德 +1 · 猫耳木鱼</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #fcfcfc;
    overflow: hidden;
    touch-action: none; /* 防止手机滑动时页面滚动 */
    -webkit-tap-highlight-color: transparent;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='%23000000' opacity='0.07'><circle cx='60' cy='60' r='10'/><circle cx='38' cy='40' r='6'/><circle cx='60' cy='34' r='6'/><circle cx='82' cy='40' r='6'/></g></svg>");
    background-size: 100px 100px;
    display: grid; place-items: center;
    user-select: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #app {
    position: relative; width: 100%; height: 100%;
    display: grid; place-items: center; cursor: pointer;
  }
  #character {
    position: relative;
    width: min(70vw, 360px); height: min(70vw, 360px);
    display: grid; place-items: center;
    transition: transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
    will-change: transform;
  }
  #character img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; transition: opacity 0.08s ease;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  
  /* 默认显示无猫耳，按住时显示猫耳 */
  #char-normal { opacity: 1; }
  #char-cat { opacity: 0; }
  #character.cat-mode #char-normal { opacity: 0; }
  #character.cat-mode #char-cat { opacity: 1; }
  
  /* 按下缩小 */
  #character.shrink { transform: scale(0.82); }
  /* 松开回弹 */
  #character.pop { animation: pop 0.2s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(0.82); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  
  /* 震动效果 */
  #character.shake { animation: shake 0.2s ease-in-out; }
  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-2px, 1px) rotate(-0.8deg); }
    50% { transform: translate(2px, -1px) rotate(0.8deg); }
    75% { transform: translate(-1.5px, 1px) rotate(-0.5deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  
  /* 功德文字 */
  #text-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .merit-text {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 22px; font-weight: 700; color: #333;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.9);
    white-space: nowrap; pointer-events: none;
    animation: floatUp 1.1s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, -10px) scale(1.05); }
    60% { opacity: 1; transform: translate(-50%, -40px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -80px) scale(0.95); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="character">
    <img id="char-normal" src="1.jpg" alt="普通形态">
    <img id="char-cat" src="2.jpg" alt="猫耳形态">
  </div>
  <div id="text-layer"></div>
</div>
<script>
(function () {
  const character = document.getElementById('character');
  const textLayer = document.getElementById('text-layer');
  const app = document.getElementById('app');

  let audioCtx = null;

  // 初始化音频上下文
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  // 播放木鱼音效
  function playWoodfish() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1180, now);
    osc.frequency.exponentialRampToValueAtTime(620, now + 0.08);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.6, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.15);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(320, now);
    osc2.frequency.exponentialRampToValueAtTime(180, now + 0.06);
    gain2.gain.setValueAtTime(0.0001, now);
    gain2.gain.exponentialRampToValueAtTime(0.25, now + 0.004);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.start(now); osc2.stop(now + 0.1);
  }

  // 生成功德 +1 文字
  function createMeritText() {
    const el = document.createElement('div');
    el.className = 'merit-text'; el.textContent = '功德 +1';
    const offsetY = -(Math.random() * 30 + 80);
    const offsetX = (Math.random() - 0.5) * 40;
    el.style.top = '50%'; el.style.left = '50%';
    el.style.marginTop = offsetY + 'px'; el.style.marginLeft = offsetX + 'px';
    textLayer.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 1150);
  }

  // 按下时触发
  function handlePress() {
    // 1. 激活猫耳形态
    character.classList.add('cat-mode');
    // 2. 缩小
    character.classList.remove('pop');
    character.classList.add('shrink');
    
    // 3. 震动
    character.classList.remove('shake'); void character.offsetWidth;
    character.classList.add('shake');
    
    // 4. 音效与文字
    initAudio(); playWoodfish();
    createMeritText();
  }

  // 松开时触发
  function handleRelease() {
    // 1. 取消猫耳形态
    character.classList.remove('cat-mode');
    // 2. 放大回弹
    character.classList.remove('shrink');
    character.classList.add('pop');
    // 清理回弹动画类，以便下次能重新触发
    setTimeout(() => { character.classList.remove('pop'); }, 250);
  }

  // 绑定事件：支持鼠标和手指触摸
  app.addEventListener('pointerdown', (e) => { e.preventDefault(); handlePress(); });
  app.addEventListener('pointerup', (e) => { e.preventDefault(); handleRelease(); });
  app.addEventListener('pointercancel', (e) => { e.preventDefault(); handleRelease(); });
  app.addEventListener('pointerleave', (e) => { e.preventDefault(); handleRelease(); });
  
  // 禁用右键菜单
  app.addEventListener('contextmenu', (e) => e.preventDefault());

})();
</script>
</body>
  </html>
